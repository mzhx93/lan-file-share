<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>局域网文件共享 · Chrome 版</title>
<script src="https://cdn.jsdelivr.net/npm/webtorrent/webtorrent.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator/qrcode.min.js"></script>
<style>
:root { --bg:#f4f6fb; --card:#fff; --accent:#2f6fed; --text:#1f2430; --muted:#6b7280; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
.wrap { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
h1 { font-size:22px; text-align:center; margin:8px 0 4px; }
.sub { text-align:center; color:var(--muted); font-size:13px; margin:0 0 20px; }
.card { background:var(--card); border-radius:14px; padding:20px; box-shadow:0 2px 12px rgba(20,40,90,.08); margin-bottom:16px; }
.btn { display:block; width:100%; border:0; border-radius:10px; padding:13px; font-size:15px; background:var(--accent); color:#fff; cursor:pointer; margin:8px 0; }
.btn.ghost { background:#eef2fb; color:var(--accent); }
.btn:active { opacity:.85; }
#status, #dl-status { text-align:center; color:var(--muted); font-size:13px; margin:10px 0; min-height:18px; }
#qr-box { text-align:center; }
#qr { display:inline-block; background:#fff; padding:10px; border:1px solid #e5e9f2; border-radius:10px; }
#qr svg, #qr img { display:block; }
.link-row { display:flex; gap:8px; margin:10px 0; }
.link-row input { flex:1; padding:9px; border:1px solid #d7dce6; border-radius:8px; font-size:12px; }
.link-row button { border:0; background:#eef2fb; color:var(--accent); border-radius:8px; padding:0 14px; cursor:pointer; }
.hint { font-size:12px; color:var(--muted); line-height:1.7; }
#file-list { list-style:none; padding:0; margin:0; }
#file-list li { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px; border-bottom:1px solid #eef0f5; font-size:14px; }
#file-list li .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#file-list li .size { color:var(--muted); font-size:12px; white-space:nowrap; }
#file-list a { color:var(--accent); text-decoration:none; font-size:13px; }
.bar { height:6px; background:#e8ecf5; border-radius:3px; overflow:hidden; margin:8px 0; }
.bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
.warn { background:#fff7e6; color:#8a6d1a; border:1px solid #f0e0b0; border-radius:8px; padding:10px; font-size:12px; line-height:1.6; margin-bottom:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="host-view">
    <h1>局域网文件共享</h1>
    <p class="sub">Chrome 浏览器版 · 点对点传输</p>
    <div class="warn" id="host-warn" hidden></div>
    <div class="card">
      <button class="btn" id="pick-dir">📁 选择文件夹</button>
      <button class="btn ghost" id="pick-file">📄 选择文件（可多选）</button>
      <input type="file" id="file-input" multiple hidden>
      <div id="status">尚未选择内容</div>
      <div id="qr-box" hidden><div id="qr"></div></div>
      <div class="link-row" id="link-box" hidden>
        <input id="link" readonly>
        <button id="copy-btn">复制</button>
      </div>
      <p class="hint">手机与电脑连接同一网络（或均能访问外网）后，用手机扫二维码即可预览/下载。</p>
    </div>
  </div>

  <div id="download-view" hidden>
    <h1>接收文件</h1>
    <p class="sub">正在通过点对点传输下载</p>
    <div class="card">
      <div id="dl-status">连接中…</div>
      <div class="bar"><i id="dl-bar"></i></div>
      <div id="dl-meta" class="hint"></div>
      <ul id="file-list"></ul>
    </div>
  </div>
</div>

<script>

const $ = (id) => document.getElementById(id);
const ANNOUNCE = [
  'wss://tracker.openwebtorrent.com',
  'wss://tracker.btorrent.xyz',
  'wss://tracker.fastcast.nz'
];

function prettyBytes(n) {
  if (n == null || isNaN(n)) return '';
  if (n < 1024) return n + ' B';
  const units = ['KB', 'MB', 'GB', 'TB'];
  let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < units.length - 1);
  return n.toFixed(1) + ' ' + units[i];
}

function baseUrl() {
  return location.origin + location.pathname;
}

const params = new URLSearchParams(location.search);
const magnet = params.get('magnet');

let client = null;
try { client = new WebTorrent(); } catch (e) { client = null; }

if (magnet) {
  $('host-view').hidden = true;
  $('download-view').hidden = false;
  runDownload(magnet);
} else {
  runHost();
}

function runHost() {
  if (location.protocol === 'file:') {
    const w = $('host-warn');
    w.hidden = false;
    w.textContent = '提示：当前以 file:// 打开，手机无法访问。请通过 HTTPS 静态托管（如 GitHub Pages）打开本页后再扫码分享。';
  }
  const dirBtn = $('pick-dir');
  const canPickDir = ('showDirectoryPicker' in window) && (location.protocol !== 'file:');
  if (!canPickDir) {
    dirBtn.textContent = '选择文件夹（此环境不支持，将退化为文件多选）';
  }
  dirBtn.onclick = async () => {
    if (canPickDir) {
      try {
        const dir = await window.showDirectoryPicker();
        const files = await readDir(dir);
        if (!files.length) { setStatus('该文件夹为空'); return; }
        seedFiles(files, dir.name);
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return;
      }
    }
    $('file-input').click();
  };
  $('pick-file').onclick = () => $('file-input').click();
  $('file-input').onchange = () => {
    const files = Array.from($('file-input').files || []);
    if (files.length) seedFiles(files, 'files');
  };
  $('copy-btn').onclick = () => {
    const link = $('link');
    link.select();
    try { if (navigator.clipboard) navigator.clipboard.writeText(link.value); } catch (e) {}
    setStatus('已复制链接');
  };
}

async function readDir(dirHandle, prefix, out) {
  prefix = prefix || '';
  out = out || [];
  for await (const entry of dirHandle.values()) {
    if (entry.kind === 'file') {
      const f = await entry.getFile();
      out.push(new File([f], prefix + f.name, { type: f.type }));
    } else if (entry.kind === 'directory') {
      await readDir(entry, prefix + entry.name + '/', out);
    }
  }
  return out;
}

function seedFiles(files, name) {
  if (!client) { setStatus('WebTorrent 加载失败，请检查网络后刷新'); return; }
  setStatus('正在生成分享（大文件可能需要一些时间）…');
  client.seed(files, { name: 'LANShare - ' + (name || 'files'), announce: ANNOUNCE }, (torrent) => {
    const url = baseUrl() + '?magnet=' + encodeURIComponent(torrent.magnetURI);
    $('link').value = url;
    $('link-box').hidden = false;
    $('qr-box').hidden = false;
    renderQR(url);
    setStatus('分享中 · ' + files.length + ' 个文件 · ' + prettyBytes(totalSize(files)));
  });
}

function totalSize(files) {
  return files.reduce((s, f) => s + (f.size || 0), 0);
}

function renderQR(text) {
  const box = $('qr');
  box.innerHTML = '';
  try {
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    if (typeof qr.createSvgTag === 'function') {
      box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2 });
    } else {
      const img = document.createElement('img');
      img.src = qr.createDataURL(4, 2);
      box.appendChild(img);
    }
  } catch (e) {
    box.textContent = '二维码生成失败（内容过长）';
  }
}

function setStatus(t) { $('status').textContent = t; }

function runDownload(magnetUri) {
  if (!client) { $('dl-status').textContent = 'WebTorrent 加载失败，请检查网络后刷新'; return; }
  let torrent;
  try {
    torrent = client.add(magnetUri, { announce: ANNOUNCE }, (t) => { renderFiles(t); });
  } catch (e) {
    $('dl-status').textContent = '连接失败: ' + (e.message || e);
    return;
  }
  torrent.on('error', (err) => {
    $('dl-status').textContent = '连接失败: ' + (err.message || err);
  });
  const timer = setInterval(() => {
    if (torrent.destroyed) { clearInterval(timer); return; }
    $('dl-bar').style.width = Math.round(torrent.progress * 100) + '%';
    $('dl-meta').textContent =
      '进度 ' + Math.round(torrent.progress * 100) + '% · ' +
      prettyBytes(torrent.downloadSpeed) + '/s · 节点 ' + torrent.numPeers;
    if (torrent.progress >= 1) {
      $('dl-status').textContent = '下载完成';
      clearInterval(timer);
    }
  }, 500);
}

function renderFiles(torrent) {
  $('dl-status').textContent = '已连接 · ' + torrent.files.length + ' 个文件';
  const ul = $('file-list');
  ul.innerHTML = '';
  torrent.files.forEach((file) => {
    const li = document.createElement('li');
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = file.name;
    const size = document.createElement('span');
    size.className = 'size';
    size.textContent = prettyBytes(file.length);
    const a = document.createElement('a');
    a.textContent = '保存';
    a.download = file.name;
    file.getBlobURL((err, url) => { if (!err) a.href = url; });
    li.appendChild(name);
    li.appendChild(size);
    li.appendChild(a);
    ul.appendChild(li);
  });
}

</script>
</body>
</html>
